name: Daily Reservation
run-name: "🏋️ AutoWOD – ${{ github.event_name == 'workflow_dispatch' && 'Manual run' || 'Daily schedule' }}"

on:
  schedule:
  # Sunday 08:00 UTC = 10:00 summer / 09:00 winter in Madrid.
  # The job waits until 13:25 Madrid before logging in.
  - cron: '0 8 * * 0'

  # Run it manually from the Actions tab whenever you need to.
  # Useful when your gym opens the whole week at once — trigger once and
  # set "Days to book ahead" to the number of days you want to cover.
  workflow_dispatch:
    inputs:
      available_days:
        description: 'Days to book ahead (leave empty to use the AVAILABLE_DAYS variable)'
        required: false
        default: ''

# Keep scheduled runs in one group. Manual runs use their own group
# so they can be used as a fallback without cancelling a scheduled run.
concurrency:
  group: reservation-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  book-session:
    name: Book Workout Session
    runs-on: ubuntu-latest
    # Long enough to cover the wait for BOOKING_TIME plus the booking itself.
    timeout-minutes: 330

    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v6

      - name: 🗓️ Decide whether to run today
        id: schedule-gate
        env:
          BOOKING_FREQUENCY: ${{ vars.BOOKING_FREQUENCY || 'daily' }}
          BOOKING_WEEKDAY: ${{ vars.BOOKING_WEEKDAY || 'sunday' }}
          BOOKING_TIME: ${{ vars.BOOKING_TIME || '13:30' }}
          EVENT_NAME: ${{ github.event_name }}
          TZ_NAME: Europe/Madrid
        run: |
          set -euo pipefail

          # Maximum allowed wait: avoids accidentally sleeping until the next day.
          MAX_WAIT_SECONDS=$(( 12 * 3600 ))

          # How late a run may start before the summary flags it as a problem.
          LATE_GRACE_SECONDS=$(( 15 * 60 ))

          frequency="$(echo "${BOOKING_FREQUENCY:-daily}" | tr '[:upper:]' '[:lower:]' | xargs)"
          target_day="$(echo "${BOOKING_WEEKDAY:-sunday}" | tr '[:upper:]' '[:lower:]' | xargs)"
          booking_time="$(echo "${BOOKING_TIME:-13:30}" | xargs)"

          if ! printf '%s' "$booking_time" | grep -qE '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'; then
            echo "Unknown BOOKING_TIME '$BOOKING_TIME'; defaulting to 13:30."
            echo "Unknown BOOKING_TIME '$BOOKING_TIME'; defaulted to 13:30 for this run." >> "$GITHUB_STEP_SUMMARY"
            booking_time="13:30"
          fi

          case "$target_day" in
            monday|tuesday|wednesday|thursday|friday|saturday|sunday) ;;
            *)
              echo "Unknown BOOKING_WEEKDAY '$BOOKING_WEEKDAY'; defaulting to daily."
              echo "Unknown BOOKING_WEEKDAY '$BOOKING_WEEKDAY'; defaulted to daily for this run." >> "$GITHUB_STEP_SUMMARY"
              frequency="daily"
              ;;
          esac

          # Today's booking window, resolved in Madrid so DST needs no cron changes.
          today_in_madrid="$(TZ="$TZ_NAME" date +%F)"
          target_epoch="$(TZ="$TZ_NAME" date -d "$today_in_madrid $booking_time" +%s)"
          wait_seconds=$(( target_epoch - $(date +%s) ))

          wait_until=""
          if [ "$wait_seconds" -gt "$MAX_WAIT_SECONDS" ]; then
            late_note="⚠️ Booking time is more than 12 hours away; not waiting."
          elif [ "$wait_seconds" -gt 0 ]; then
            wait_until="$target_epoch"
            late_note="Will book at $booking_time (Europe/Madrid), in $(( wait_seconds / 60 )) min."
          elif [ "$wait_seconds" -ge "-$LATE_GRACE_SECONDS" ]; then
            late_note="Booking window already open (started $(( -wait_seconds / 60 )) min after $booking_time, Europe/Madrid) — booking right now."
          else
            late_note="⚠️ GitHub started this run $(( -wait_seconds / 60 )) min after $booking_time (Europe/Madrid) — booking right now. If this keeps happening, move the cron times in this workflow earlier."
          fi

          # Gate on the day the booking actually lands on, not on the day the
          # runner happened to boot — those differ when the wait crosses midnight.
          if [ -n "$wait_until" ]; then
            today="$(TZ="$TZ_NAME" date -d "@$target_epoch" +%A | tr '[:upper:]' '[:lower:]')"
          else
            today="$(TZ="$TZ_NAME" date +%A | tr '[:upper:]' '[:lower:]')"
          fi
